services:
  db:
    image: postgres:15-alpine
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: meu_usuario
      POSTGRES_PASSWORD: minha_senha
      POSTGRES_DB: meu_banco
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meu_usuario -d meu_banco"]
      interval: 5s
      timeout: 5s
      retries: 5

  back:
    build: ./back
    container_name: fastapi_back
    restart: always
    volumes:
      - ./back:/app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://meu_usuario:minha_senha@db:5432/meu_banco
    depends_on:
      db:
        condition: service_healthy 
    networks:
      - app-network

  front:
    build: ./front/supermercado
    container_name: vite_front
    restart: always
    volumes:
      - ./front/supermercado:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
      - VITE_USE_MOCK=false
    depends_on:
      - back
    networks:
      - app-network

volumes:
  postgres_data:

networks:
  app-network:
    driver: bridge